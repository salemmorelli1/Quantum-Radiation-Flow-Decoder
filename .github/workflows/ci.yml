name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci-lock.txt
      - name: Install
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci-lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
      - name: Compile
        run: python -m compileall src tests scripts report
      - name: Validate repository surface
        run: python scripts/part4_validate_repository.py
